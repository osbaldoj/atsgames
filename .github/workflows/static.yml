name: Validate static website
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build public pages
        run: python3 scripts/build.py
      - name: Check public output
        run: python3 scripts/check.py dist
      - name: Check locale routing and legal translations
        run: python3 -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: atsgames-static
          path: dist/
          if-no-files-found: error
